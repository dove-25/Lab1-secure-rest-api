name: Security scan
run-name: Security scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for OWASP scanner
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        id: install
        run: npm ci --ignore-scripts

      - name: Restore vulnerability database
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: dependency-check-v13-${{ runner.os }}-${{ github.run_id }}
          restore-keys: dependency-check-v13-${{ runner.os }}-

      - name: Run full dependency npm audit scan
        run: |
          mkdir -p reports
          npm audit --registry=https://registry.npmjs.org --audit-level=moderate --json > reports/npm-audit.json

      - name: Run SCA OWASP Dependency-Check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          curl --fail --location --retry 3 \
            https://github.com/dependency-check/DependencyCheck/releases/download/v13.0.0/dependency-check-13.0.0-release.zip \
            --output "$RUNNER_TEMP/dependency-check.zip"
          echo "44d920d1ec03e948df862a253f0912782a31b9beee8a7c8895b9cb95760176ed  $RUNNER_TEMP/dependency-check.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/dependency-check.zip" -d "$RUNNER_TEMP/owasp"
          chmod +x "$RUNNER_TEMP/owasp/dependency-check/bin/dependency-check.sh"
          mkdir -p reports
          # npm audit above covers production AND development dependencies.
          # Give OWASP a separate production install to avoid dev-only aliases
          # and optional binaries for other operating systems/architectures.
          production_dir="$RUNNER_TEMP/owasp-production"
          mkdir -p "$production_dir"
          cp package.json package-lock.json "$production_dir/"
          npm ci --omit=dev --ignore-scripts --prefix "$production_dir"
          "$RUNNER_TEMP/owasp/dependency-check/bin/dependency-check.sh" \
            --project "Lab1 Secure REST API" \
            --scan "$production_dir/package-lock.json" --scan "$production_dir/node_modules" \
            --data "$RUNNER_TEMP/dependency-check-data" \
            --nvdDatafeed 'https://nvd.nist.gov/feeds/json/cve/2.0/nvdcve-2.0-{0}.json.gz' \
            --out reports --format HTML --format JSON \
            --log reports/dependency-check.log \
            --failOnCVSS 7 --disableAssembly --disableOssIndex \
            --nodePackageSkipDevDependencies --nodeAuditSkipDevDependencies

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-reports
          path: reports/
          retention-days: 14
