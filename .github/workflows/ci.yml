name: security scan
run-name: security scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup npm
        run: npm install --global npm@11.21.1 --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        id: install
        run: npm ci --ignore-scripts --no-audit

      - name: npm audit
        run: |
          mkdir -p reports
          npm audit --registry=https://registry.npmjs.org --audit-level=moderate --json > reports/npm-audit.json

      - name: OWASP Dependency-Check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: dependency-check/Dependency-Check_Action@main
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: Lab1 Secure REST API
          path: package-lock.json
          format: HTML
          out: reports/owasp
          args: --failOnCVSS 7

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-reports
          path: reports/
